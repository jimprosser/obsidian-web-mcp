[project]
name = "obsidian-web-mcp"
version = "0.1.0"
description = "Secure remote MCP server for Obsidian vaults -- access your notes from Claude, your phone, or any MCP client, anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0",
    "watchdog>=4.0.0",
    "httpx>=0.27",
    "google-auth>=2.0",
    "requests>=2.0",
    "cryptography>=48.0.1,<49",
    # pydantic-settings: tranzytywna (mcp[cli]→pydantic-settings), przypięta JAWNIE
    # dla alertu Dependabota (06.07.2026):
    #   GHSA-4xgf-cpjx-pc3j (MEDIUM) — pydantic-settings: NestedSecretsSettingsSource
    #     podąża za symlinkami poza secrets_dir (odczyt lokalnych plików); patch 2.14.2.
    #     Nie używamy secrets_dir ani BaseSettings w kodzie repo — blast radius zerowy.
    # Podłoga bez sufitu (wzorzec jarvis-infra #231) — górną granicę trzyma mcp.
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vault-mcp = "obsidian_vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_vault_mcp"]
